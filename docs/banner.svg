<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">AAHAARAM — One scan. One meal. No double-dipping.</title>
  <desc id="d">QR meal distribution for events, with live counts and admin controls. Built with React, Vite, Tailwind, Express, MongoDB, JWT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171003"/>
      <stop offset=".6" stop-color="#2B1D06"/>
      <stop offset="1" stop-color="#171003"/>
    </linearGradient>
    <linearGradient id="wash" gradientUnits="userSpaceOnUse" x1="1200" y1="0" x2="680" y2="340">
      <stop offset="0" stop-color="#F59E0B" stop-opacity=".38"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="210" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <style>
    .rise { animation: rise .8s cubic-bezier(.2,.7,.3,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    .rule { stroke-dasharray: 150; animation: draw 1s cubic-bezier(.4,0,.2,1) .35s backwards; }
    @keyframes draw { from { stroke-dashoffset: 150; } }
    /* Opacity only — a CSS transform here would override the translate
       attribute on the same element and rip the glyph out of position. */
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.34; } 50% { opacity:.62; } }
    .ring { animation: ring 3.2s ease-out infinite; transform-origin: 1010px 150px; }
    @keyframes ring { 0% { opacity:.5; transform: scale(.7); } 100% { opacity:0; transform: scale(1.5); } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .rule, .pulse, .ring { animation: none; }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#wash)"/>
    <circle class="ring" cx="1010" cy="150" r="120" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <g class="pulse" transform="translate(1010,150)">
      <g transform="translate(-32,-32)">
        <path d="M8 20V10a2 2 0 0 1 2-2h10M44 8h10a2 2 0 0 1 2 2v10M56 44v10a2 2 0 0 1-2 2H44M20 56H10a2 2 0 0 1-2-2V44M8 32h48" fill="none" stroke="#FCD34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="18" fill="none" stroke="#F59E0B" stroke-opacity=".35"/>

  <g class="rise">
    <text x="60" y="118" font-family="Impact, Haettenschweiler, 'Franklin Gothic Bold', 'Arial Black', sans-serif" font-size="62" letter-spacing="1.5" fill="#fff">AAHAARAM</text>
  </g>
  <line class="rule" x1="60" y1="142" x2="210" y2="142" stroke="url(#rule)" stroke-width="3"/>

  <g class="rise" style="animation-delay:.15s">
    <text x="60" y="186" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#FCD34D">One scan. One meal. No double-dipping.</text>
    <text x="60" y="218" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="16" fill="#fff" fill-opacity=".62">QR meal distribution for events, with live counts and admin controls.</text>
  </g>

    <g class="rise" style="animation-delay:0.50s">
      <rect x="60" y="258" width="69" height="32" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/>
      <text x="94.5" y="279" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#fff" fill-opacity=".85">React</text>
    </g>
    <g class="rise" style="animation-delay:0.56s">
      <rect x="138" y="258" width="61" height="32" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/>
      <text x="168.5" y="279" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#fff" fill-opacity=".85">Vite</text>
    </g>
    <g class="rise" style="animation-delay:0.62s">
      <rect x="208" y="258" width="92" height="32" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/>
      <text x="254" y="279" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#fff" fill-opacity=".85">Tailwind</text>
    </g>
    <g class="rise" style="animation-delay:0.68s">
      <rect x="309" y="258" width="85" height="32" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/>
      <text x="351.5" y="279" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#fff" fill-opacity=".85">Express</text>
    </g>
    <g class="rise" style="animation-delay:0.74s">
      <rect x="403" y="258" width="85" height="32" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/>
      <text x="445.5" y="279" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#fff" fill-opacity=".85">MongoDB</text>
    </g>
    <g class="rise" style="animation-delay:0.80s">
      <rect x="497" y="258" width="53" height="32" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/>
      <text x="523.5" y="279" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#fff" fill-opacity=".85">JWT</text>
    </g>
</svg>
